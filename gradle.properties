# ===== 构建环境 =====
# 本机 HTTP(S)_PROXY 环境变量与 ~/.gradle/gradle.properties 都指向已停用的本地代理
# (127.0.0.1:10808)，且用户级配置里还有 trustStoreType=Windows-ROOT（沙箱下无法访问
# 系统证书库）。这里统一覆盖为：直连 + JDK 自带 cacerts，否则构建期所有 HTTPS 都会 TLS 失败。
# 只留内存设置。
# 原来这里还挂着 -Djavax.net.ssl.trustStoreType / -Dhttp.nonProxyHosts —— 那几条是早期
# 为了绕过代理问题加的，但它们的副作用是让每次构建都想 fork 一个"特殊配置的 daemon"，
# 而那个 fork 在 Windows 上会间歇性死锁（构建卡十几分钟不动）。
# 代理问题现在用 --offline + 清空 *_PROXY 环境变量解决，不需要挂在 jvmargs 里。
org.gradle.jvmargs=-Xmx3G
# 用常驻 daemon：单次 daemon（false）在 Windows 上会间歇性死锁 ——
# 表现是构建卡住十几分钟不动、日志只停在 "single-use Daemon process will be forked"。
# 之前改成 true 失败是因为积了 9 个僵尸 daemon；清干净之后这个配置是稳的。
org.gradle.daemon=true
systemProp.http.nonProxyHosts=*
systemProp.https.nonProxyHosts=*

